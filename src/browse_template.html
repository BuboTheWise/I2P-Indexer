<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I2P Indexer &mdash; Address Book Browser</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* === Reset & base (dark theme matching export style) ======================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;font-size:12px;color:#e0e0e0;
    background:#0a0a0f;padding:8px;line-height:1.4}

/* === Header =============================================================== */
.header{text-align:center;padding:12px 0 8px;border-bottom:1px solid #333;margin-bottom:12px}
.header h1{font-size:18px;color:#fff;font-weight:normal;letter-spacing:2px}
.header .subtitle{color:#666;font-size:11px;margin-top:4px}

/* === Stats bar ============================================================ */
.stats{display:flex;gap:16px;padding:8px 12px;margin-bottom:8px;
      border:1px solid #333;border-radius:4px;background:#111;font-size:11px;flex-wrap:wrap}
.stats span{white-space:nowrap}
.ok{color:#5f5}.down{color:#f55}

/* === Tabs ================================================================= */
.tabs{display:flex;gap:0;margin-bottom:8px;border:1px solid #333;border-radius:4px;overflow:hidden}
.tab-btn{flex:1;padding:6px;text-align:center;background:#111;color:#999;
    border:none;cursor:pointer;font-size:12px;font-family:inherit;transition:.15s}
.tab-btn.active{background:#222;color:#fff;border-bottom:2px solid #5f5}
.tab-btn:hover:not(.active){background:#1a1a1a}
.tab-pane{display:none}.tab-pane.active{display:block}

/* === Controls ============================================================= */
.controls{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.controls input[type="text"]{flex:1;min-width:160px;padding:4px 8px;
    background:#111;color:#ccc;border:1px solid #444;border-radius:3px;font-size:12px;font-family:inherit}
.controls select,.controls button,.filter-btn{padding:4px 8px;background:#1a1a1a;color:#ccc;
    border:1px solid #444;border-radius:3px;font-size:11px;cursor:pointer;font-family:inherit}
.controls button:hover,.controls select:hover,.filter-btn:hover{border-color:#888}
.filter-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;align-items:center;gap:4px;font-size:11px;color:#aaa}
.filter-group label{color:#888}
.filter-active{position:relative}
.filter-active::after{content:'';width:5px;height:5px;background:#5f5;border-radius:50%;position:absolute;top:-2px;right:-2px}

/* === Toggle panel button ================================================== */
.adv-toggle{font-size:11px;color:#5f5;cursor:pointer;padding:4px 8px;border:1px solid #333;
    border-radius:3px;background:#111;font-family:inherit}
.adv-toggle:hover{border-color:#888}
.adv-panel{display:none;margin-bottom:8px;padding:8px 12px;border:1px solid #333;
    border-radius:4px;background:#111;font-size:11px}
.adv-panel.open{display:block}

/* === Column filter dropdowns (Excel-style) ================================= */
.col-filter-wrap{position:relative;display:inline-block;width:100%}
.col-filter-btn{background:none;border:none;color:#555;cursor:pointer;padding:0 2px;font-size:10px;
    margin-left:4px;vertical-align:middle;opacity:.6}
.col-filter-btn:hover,.col-filter-btn.open{color:#fff;opacity:1}
.col-filter-menu{display:none;position:absolute;top:100%;left:0;z-index:100;
    background:#181820;border:1px solid #555;border-radius:4px;padding:6px 8px;
    max-height:260px;overflow-y:auto;font-size:11px;color:#ccc;min-width:160px;
    box-shadow:0 4px 12px rgba(0,0,0,.7)}
.col-filter-menu.open{display:block}
.col-filter-menu label{display:flex;align-items:center;gap:5px;padding:2px 0;cursor:pointer;white-space:nowrap}
.col-filter-menu input[type="checkbox"]{accent-color:#5f5;margin:0}
.col-filter-menu .cfm-count{color:#666;font-size:10px;margin-left:auto;flex-shrink:0}
.cfm-actions{display:flex;gap:8px;padding-top:4px;border-top:1px solid #333;margin-top:4px}
.cfm-actions button{flex:1;padding:2px;background:#222;color:#aaa;border:1px solid #444;
    border-radius:2px;font-size:10px;cursor:pointer;font-family:inherit}
.cfm-actions button:hover{border-color:#888;color:#fff}
.col-filter-badge{display:none;background:#5f5;color:#000;font-size:9px;border-radius:50%;
    width:14px;height:14px;line-height:14px;text-align:center;margin-left:3px;vertical-align:middle;font-weight:bold}

/* === Table (auto-layout so text wraps) ==================================== */
table{width:100%;border-collapse:collapse;table-layout:auto}
th,td{padding:4px 8px;border:1px solid #222;word-wrap:break-word;text-overflow:ellipsis}
thead th{position:sticky;top:0;background:#15151a;color:#aaa;cursor:pointer;user-select:none}
thead th:hover{background:#252530;color:#fff}
thead .sort-asc::after{content:' &uarr;'>}thead .sort-desc::after{content:' &darr;'>}
/* Column minimum widths */
  col.c-status{min-width:48px;}col.c-type{min-width:70px;max-width:160px;}
  col.c-site{min-width:120px;}col.c-title{min-width:100px;}
  col.c-summary{min-width:150px;}col.c-site-type{min-width:80px;max-width:140px;}
  col.c-purpose{min-width:80px;max-width:200px;}col.c-analysed{min-width:90px;max-width:110px;}
  col.c-rt{min-width:48px;}col.c-size{min-width:48px;}
  col.c-lang{min-width:42px;}col.c-time{min-width:130px;}col.c-links{min-width:28px;}
  col.c-interest{min-width:48px;}

tbody tr:nth-child(even){background:#0e0e14}
tbody tr:hover{background:#1a1a28;cursor:pointer}
.unreachable{color:#666!important;opacity:.55}
.status-ok{text-decoration:none;color:#5f5;font-weight:bold}.status-down{text-decoration:none;color:#f55}
a.no-std{color:inherit;text-decoration:none}.no-std:hover{color:#ccc}

/* === Details row (expand) ================================================= */
.detail-row td{background:#101018;border-left:3px solid #333;padding:8px 12px;font-size:11px;
    color:#bbb;white-space:normal;table-layout:auto}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.detail-label{color:#666;text-align:right;font-weight:bold}

/* === Pagination =========================================================== */
.pager{text-align:center;margin-top:8px;padding:4px;color:#999;font-size:11px;
    display:flex;justify-content:center;gap:6px;align-items:center}
.pager button{padding:3px 10px;background:#1a1a1a;color:#ccc;border:1px solid #444;
     border-radius:3px;font-size:11px;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:#888}
.pager button:disabled{opacity:.35}
.jump-input{width:50px;text-align:center;padding:2px;background:#111;color:#ccc;border:1px solid #444;
    border-radius:3px;font-size:11px;font-family:inherit}

/* === Timeline (tab 2) ===================================================== */
.tl-search{width:100%;padding:6px;margin-bottom:8px;background:#111;color:#ccc;
    border:1px solid #444;border-radius:3px;font-size:12px;font-family:inherit}
.tl-timeline{position:relative;padding-left:20px;margin-top:8px}
.tl-timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:#333}
.tl-point{position:relative;margin-bottom:12px;padding:6px 10px;border-radius:4px;
    background:#111;border:1px solid #333}
.tl-point::before{content:'';position:absolute;left:-17px;top:8px;width:8px;height:8px;
    border-radius:50%;border:2px solid #0a0a0f}
.tl-point.up::before{background:#5f5}.tl-point.down::before{background:#f55}
.tl-dns{color:#fff;font-size:12px;font-weight:bold}
.tl-meta{font-size:10px;color:#888;margin-top:2px}

/* === Footer =============================================================== */
.footer{text-align:center;color:#444;font-size:10px;margin-top:12px;padding:4px}

/* === Empty state ========================================================== */
.empty{text-align:center;padding:40px;color:#555;font-size:13px}

@media(max-width:600px){
  body{padding:4px}.stats{gap:8px}.controls{flex-direction:column}
  .filter-row{flex-direction:column}.controls input[type="text"]{min-width:unset;width:100%}
  .detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <h1>I2P INDEXER &mdash; ADDRESS BOOK</h1>
  <div class="subtitle" id="header-subtitle"></div>
</div>

<div class="stats" id="stats"></div>

<!-- Tabs -->
<div class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="browse-table">Browse Table</button>
  <button class="tab-btn" data-tab="browse-timeline">Timeline View</button>
  <button class="tab-btn" data-tab="browse-chart">Reachability Trends</button>
</div>

<!-- ======== REACHABILITY CHART TAB ======= -->
<div class="tab-pane" id="browse-chart">
  <div style="padding:12px 0;">
    <canvas id="reach-chart" width="900" height="340"></canvas>
  </div>
  <div id="chart-legend" style="display:flex;justify-content:center;gap:24px;padding:8px;font-size:11px;color:#aaa"></div>
</div>

<!-- ======== BROWSE TABLE TAB ======= -->
<div class="tab-pane active" id="browse-table">
  <!-- Basic controls -->
  <div class="controls">
    <input type="text" id="filter" placeholder="Search dns / title / type / site type / summary ..." autofocus>
    <label style="font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap">
      <input type="checkbox" id="show-unreachable"> show down</label>
    <label style="font-size:11px">rows <select id="pageSize">
        <option value="25">25</option><option value="50" selected>50</option>
        <option value="100">100</option><option value="200">200</option></select></label>
    <button id="adv-toggle" class="adv-toggle">+ filters</button>
    <button id="reset-btn">Reset</button>
  </div>

  <!-- Advanced filters -->
  <div class="adv-panel" id="adv-panel">
    <div class="filter-row">
      <div class="filter-group"><label>Type:</label>
        <select id="filter-type"><option value="">all types</option></select></div>
      <div class="filter-group"><label>Status:</label>
        <select id="filter-status"><option value="any">any</option><option value="1">up</option><option value="0">down</option></select></div>
      <div class="filter-group"><label>Language:</label>
        <select id="filter-lang"><option value="">all languages</option></select></div>
    </div>
    <div class="filter-row" style="margin-top:6px">
      <div class="filter-group"><label>Site Type:</label>
        <select id="filter-site-type"><option value="">all types</option></select></div>
      <div class="filter-group"><label>Analysed After:</label>
        <input type="text" id="filter-analysed-after" placeholder="YYYY-MM-DD" style="width:120px;font-size:11px"></div>
    </div>
  </div>

  <!-- Table -->
  <div style="overflow-x:auto">
  <table id="grid" role="grid">
    <colgroup>
      <col class="c-status"><col class="c-type"><col class="c-site">
      <col class="c-title"><col class="c-summary"><col class="c-site-type"><col class="c-purpose"><col class="c-analysed"><col class="c-rt">
      <col class="c-size"><col class="c-lang"><col class="c-time"><col class="c-links"><col class="c-interest">
    </colgroup>
    <thead id="head"></thead><tbody id="body"></tbody>
  </table>
  </div>

  <!-- Pagination -->
  <div class="pager" id="pager"></div>
</div>

<!-- ======== TIMELINE TAB ======= -->
<div class="tab-pane" id="browse-timeline">
  <input class="tl-search" type="text" id="tl-filter" placeholder="Search timeline entries by dns name ...">
  <div id="tl-stats" style="font-size:11px;color:#888;margin-bottom:8px"></div>
  <div class="tl-timeline" id="tl-body"></div>
</div>

<div class="footer" id="footer"></div>

<script>
// --- Embedded datasets -----------------------------------------------------
const ENTRIES  = __ENTRIES_JSON__;
const TIMELINE = __TIMELINE_JSON__;
const REACHABILITY_SERIES = __REACHABILITY_SERIES_JSON__;

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(s){return(typeof s==='string')?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'0'}
function escId(s){return (typeof s==='string')?s.replace(/[^\w.-]/g,'_'):''}

// ---------------------------------------------------------------------------
// Populate filter options
// ---------------------------------------------------------------------------
(function initFilterOptions(){
  const types=new Set(), langs=new Set(), siteTypes=new Set();
  for(const r of ENTRIES){if(r.content_type)types.add(r.content_type); if(r.detected_lang&&r.detected_lang!=='en')langs.add(r.detected_lang); if(r.deep_site_type)siteTypes.add(r.deep_site_type)}
  const fs=document.getElementById('filter-type');
  for(const t of[...types].sort()){const o=document.createElement('option');o.value=t;o.textContent=t;fs.appendChild(o)}
  const fl=document.getElementById('filter-lang');
  for(const l of[...langs].sort()){const o=document.createElement('option');o.value=l;o.textContent=l.toUpperCase();fl.appendChild(o)}
  const fst=document.getElementById('filter-site-type');
  if(fst){for(const t of[...siteTypes].sort()){const o=document.createElement('option');o.value=t;o.textContent=t;fst.appendChild(o)}}
})();

// ---------------------------------------------------------------------------
// Column definitions
// ---------------------------------------------------------------------------
const COLS=[
  {key:'_status',      label:'Status'},
  {key:'content_type', label:'Type'},
  {key:'dns_name',     label:'Site'},
  {key:'title',        label:'Title'},
  {key:'content_summary',label:'Summary'},
  {key:'deep_site_type',label:'Site Type'},
  {key:'deep_purpose',   label:'Purpose'},
  {key:'deep_analyzed_at',label:'Analysed'},
  {key:'response_time_sec',label:'Response Time'},
  {key:'body_length',  label:'Size'},
  {key:'detected_lang',label:'Language'},
  {key:'last_probed_utc',label:'Last Probed'},
  {key:'_linkcount',   label:'Links'},
  {key:'interest_score',label:'Interest'},
];

const hiBytes=v=>{if(!v||v===0)return'';if(v<1024)return v+'B';const k=v/1024;if(k<1024)return k.toFixed(1)+'KB';return(k/1024).toFixed(1)+'MB'};
const hiRT=v=>{if(!v||v===0)return'';return v.toFixed(1)+'s'};
function interestBadge(v){
  if(v==null||v===0)return'';
  let bg,color;
  if(v<=3){bg='#555';color='#888'}
  else if(v<=6){bg='#b8860b';color='#fff'}
  else if(v<=8){bg='#2e7d32';color='#fff'}
  else{bg='#00c853';color='#fff'}
  return`<span style="display:inline-block;padding:1px 6px;border-radius:3px;background:${bg};color:${color};font-size:11px;font-weight:bold">${v}/10</span>`;
}
function tryJson(v){try{return JSON.parse(v)}catch{if(typeof v==='object'&&v!==null)return v;return[]}}

// Precompute display helper values
for(const r of ENTRIES){
  r._status = r.reachable ? 'OK' : 'DOWN';
  const raw=r.found_links;
  r._linkcount=(Array.isArray(raw)?raw.length:(typeof raw==='string'?tryJson(raw).length:0))||0;
}

function colValue(r,key){
  if(key==='response_time_sec')return hiRT(r[key]);
  if(key==='body_length')return hiBytes(r[key]);
  if(key==='_linkcount')return r[key]??0;
  return r[key]??'';
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let sortKey='dns_name', sortAsc=false;
let filterText='';
let showUnreachable=true;
let pageSize=50, page=1;
// Column filters: Set of allowed values per column key. Undefined = all values pass.
let colFilters = {};

// Columns eligible for multi-value dropdown filters (low cardinality)
const FILTERABLE_COLS = new Set(['_status', 'content_type', 'deep_site_type', 'detected_lang']);

// Open menu tracking
let openFilterMenu = null;

function filteredRows(){
  const siteTypeVal = document.getElementById('filter-site-type')?.value || '';
  const analysedAfter = document.getElementById('filter-analysed-after')?.value || '';
  return ENTRIES.filter(r=>{
    if(!showUnreachable&&!r.reachable)return false;
    // Column filters
    for(const [key, allowed] of Object.entries(colFilters)){
      let val;
      if(key==='_status') val = r._status;
      else val = r[key];
      if(val===undefined||val===null) val='';
      if(!allowed.has(String(val))) return false;
    }
    // Site type filter
    if(siteTypeVal && r.deep_site_type!==siteTypeVal) return false;
    // Analysed after filter
    if(analysedAfter && (r.deep_analyzed_at||'')<analysedAfter) return false;
    // Text search includes detected_lang and deep_purpose now
    if(filterText){
      const q=filterText.toLowerCase();
      const hay=[r.dns_name,r.title,r.content_type,r.deep_site_type,r.deep_purpose,r.content_summary,
                 r.detected_lang].join(' ').toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}

function sortFn(a,b){
  let va=colValue(a,sortKey), vb=colValue(b,sortKey);
  if(va==null)va='';if(vb==null)vb='';
  if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
  return sortAsc?va-vb:vb-va;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render(){
  let rows=filteredRows();rows.sort(sortFn);
  const total=Math.ceil(rows.length/pageSize)||1;
  if(page>total)page=total;
  const slice=rows.slice((page-1)*pageSize,page*pageSize);

  // Header — with column filter buttons for eligible columns
  let h=''; for(const c of COLS){
    const cls=sortKey===c.key?(sortAsc?'sort-asc':'sort-desc'):'';
    const isFilterable = FILTERABLE_COLS.has(c.key);
    const hasActiveFilter = colFilters[c.key] && colFilters[c.key].size > 0;
    const badgeStyle = hasActiveFilter ? 'style="display:inline"' : '';
    h+=`<th class="${cls}" data-key="${c.key}"><span>${esc(c.label)}</span>`;
    if(isFilterable){
      h+=`<button class="col-filter-btn" data-col="${c.key}" title="Filter by ${esc(c.label)}">▼</button>`;
      h+=`<span class="col-filter-badge" ${badgeStyle}>●</span>`;
    }
    h+=`</th>`;
  }
  document.getElementById('head').innerHTML=h;

  // Body
  let b=''; for(const r of slice){
    const unrc=r.reachable?'':'unreachable';
    const scl=r.reachable?'status-ok':'status-down';
    const sid=escId(r.dns_name);
    b+=`<tr class="${unrc}" data-id="${sid}">`;
    b+=`<td class="${scl}">${r._status}</td>`;
    b+=`<td>${esc(r.content_type||'')}</td>`;
    b+=`<td style="overflow:visible;white-space:normal">${esc(r.dns_name)}</td>`;
    b+=`<td title="${esc((r.content_summary||'').replace(/"/g,'&quot;'))}">${esc(r.title||'')}</td>`;
    const summary=esc(r.content_summary||'—');
    b+=`<td title="${esc((r.content_summary||'').replace(/"/g,'&quot;'))}">${summary}</td>`;
    b+=`<td>${esc(r.deep_site_type||'')}</td>`;
    b+=`<td title="${esc((r.deep_purpose||"").replace(/"/g,"\&quot;"))}">${esc((r.deep_purpose||"").substring(0,120))}</td>`;

    b+=`<td>${esc(r.deep_analyzed_at||"")}</td>`;

    b+=`<td>${hiRT(r.response_time_sec)}</td>`;
    b+=`<td>${hiBytes(r.body_length)}</td>`;
    const langLabel=r.detected_lang&&r.detected_lang!=='en'?r.detected_lang.toUpperCase():'';
    b+=`<td title="ISO 639-1">${esc(langLabel)}</td>`;
    b+=`<td title="${esc((r.content_summary||'').replace(/"/g,'&quot;'))}">${esc(r.last_probed_utc||'')}</td>`;
    b+=`<td>${r._linkcount}</td>`;
    b+=`<td style="text-align:center">${interestBadge(r.interest_score)}</td>`;
    b+=`</tr>`;
  }
  document.getElementById('body').innerHTML=b;

  // Pagination
  let pg=`<button ${page<=1?'disabled':''} onclick="goPage(page-1)">prev</button>`;
  pg+=`<span>${page}/${total} (${rows.length})</span>`;
  pg+=`<button ${page>=total?'disabled':''} onclick="goPage(page+1)">next</button>`;
  document.getElementById('pager').innerHTML=pg;

  // Stats
  const ok=ENTRIES.filter(r=>r.reachable).length, down=ENTRIES.length-ok;
  const colFilterCount = Object.keys(colFilters).length;
  document.getElementById('stats').innerHTML=
    `<span>Total: ${ENTRIES.length}</span><span class="ok">Reachable: ${ok}</span>` +
    `<span class="down">Unreachable: ${down}</span><span>Showing: ${rows.length} filtered` +
    (colFilterCount ? ` (${colFilterCount} col filter${colFilterCount>1?'s':''})` : '') + `</span>`;

  // Highlight active filters in header bar too
  const advBtn=document.getElementById('adv-toggle');
  if(colFilterCount){
    advBtn.classList.add('filter-active');}else{advBtn.classList.remove('filter-active');}
}

function goPage(n){page=n;render();}

// ---------------------------------------------------------------------------
// Event listeners (non-head; head is handled below in column-filter section)
// ---------------------------------------------------------------------------
document.getElementById('filter').addEventListener('input',e=>{filterText=e.target.value;page=1;render();});
document.getElementById('show-unreachable').checked=true;
document.getElementById('show-unreachable').addEventListener('change',e=>{showUnreachable=e.target.checked;page=1;render();});

document.getElementById('pageSize').value=pageSize;
document.getElementById('pageSize').addEventListener('change',e=>{pageSize=parseInt(e.target.value);page=1;render();});

// Advanced toggle
document.getElementById('adv-toggle').addEventListener('click',()=>{
  const p=document.getElementById('adv-panel');p.classList.toggle('open');});

// Reset
document.getElementById('reset-btn').addEventListener('click',()=>{
  filterText='';document.getElementById('filter').value='';
  showUnreachable=true;document.getElementById('show-unreachable').checked=true;
  pageSize=50;document.getElementById('pageSize').value='50';
  sortKey='dns_name';sortAsc=false;page=1;
  colFilters={};
  // Clear advanced dropdowns too (still useable in panel)
  document.getElementById('filter-type').value='';
  document.getElementById('filter-lang').value='';
  document.getElementById('filter-status').value='any';
  closeAllFilterMenus();
  render();});

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.tab).classList.add('active');
  if(btn.dataset.tab==='browse-timeline'&&typeof renderTimeline==='function'){renderTimeline();}
  if(btn.dataset.tab==='browse-chart'&&typeof renderChart==='function'){renderChart();}
});});

// ---------------------------------------------------------------------------
// Timeline tab
// ---------------------------------------------------------------------------
document.getElementById('tl-filter').addEventListener('input',renderTimeline);
function renderTimeline(){
  const q=document.getElementById('tl-filter').value.toLowerCase();
  let items=TIMELINE;if(q)items=TIMELINE.filter(t=>t.dns_name.toLowerCase().indexOf(q)>-1);
  document.getElementById('tl-stats').textContent=`${items.length} entries (${new Set(items.map(t=>t.dns_name)).size} unique sites)`;
  let h='';for(const t of items){
    const cls=t.reachable?'up':'down';
    h+=`<div class="tl-point ${cls}">`;
    h+=`<span class="tl-dns">${esc(t.dns_name)}</span>`;
    h+=`<span class="tl-meta"> ${t.probed_at_utc} &mdash; `;
    h+= t.reachable ? `<span style="color:#5f5">REACHED (HTTP ${t.status_code})</span>` : `<span style="color:#f55">UNREACHABLE${t.status_code?` (${t.status_code})`:''}</span>`;
    h+=`</span></div>`;
  }
  document.getElementById('tl-body').innerHTML=h||'<div class="empty">No timeline data available.</div>';
}

// ---------------------------------------------------------------------------
// Reachability Trends — canvas-based area/line chart
// ---------------------------------------------------------------------------
function renderChart(){
  const canvas=document.getElementById('reach-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;

  // Margins
  const ML=60, MR=20, MT=30, MB=50;
  const cw=W-ML-MR, ch=H-MT-MB;

  // Clear
  ctx.fillStyle='#0a0a0f';
  ctx.fillRect(0,0,W,H);

  const data=REACHABILITY_SERIES;
  if(!data||data.length===0){
    ctx.fillStyle='#555';ctx.font='13px Courier New';ctx.textAlign='center';
    ctx.fillText('No reachability trend data available.',W/2,H/2);
    document.getElementById('chart-legend').textContent='';
    return;
  }

  const n=data.length;
  const xStep=cw/(n-1>n?n-1:1);

  // Grid lines (y axis — 0,25,50,75,100 %)
  ctx.strokeStyle='#222';ctx.lineWidth=1;
  for(let p of [0,25,50,75,100]){
    const y=MT+ch-(p/100)*ch;
    ctx.beginPath();ctx.moveTo(ML,y);ctx.lineTo(ML+cw,y);ctx.stroke();
    ctx.fillStyle='#666';ctx.font='10px Courier New';ctx.textAlign='right';
    ctx.fillText(`${p}%`,ML-6,y+3);
  }

  // X labels — show every Nth label to avoid overlap
  const xLabelStep=Math.max(1,Math.floor(n/8));
  ctx.fillStyle='#666';ctx.font='9px Courier New';ctx.textAlign='center';
  for(let i=0;i<n;i+=xLabelStep){
    const x=ML+i*xStep;
    // Extract just the time portion for brevity
    let label=data[i].ts_utc||'';
    if(label.length>13) label=label.substring(5);
    ctx.fillText(label,x,H-MB+14);
  }

  // Build points array
  const pts=data.map((d,i)=>({
    x: ML+i*xStep,
    y: MT+ch-(d.pct/100)*ch,
    pct: d.pct,
    reachable: d.reachable,
    unreachable: d.unreachable,
    ts: d.ts_utc,
  }));

  // Green area (reachable portion)
  ctx.beginPath();
  ctx.moveTo(pts[0].x, MT+ch);
  for(const p of pts){ctx.lineTo(p.x,p.y);}
  ctx.lineTo(pts[n-1].x,MT+ch);
  ctx.closePath();
  const gGrad=ctx.createLinearGradient(0,MT,0,MT+ch);
  gGrad.addColorStop(0,'rgba(85,255,85,0.25)');
  gGrad.addColorStop(1,'rgba(85,255,85,0.03)');
  ctx.fillStyle=gGrad;ctx.fill();

  // Green line
  ctx.beginPath();
  ctx.strokeStyle='#5f5';ctx.lineWidth=2;
  for(let i=0;i<pts.length;i++){
    i===0?ctx.moveTo(pts[i].x,pts[i].y):ctx.lineTo(pts[i].x,pts[i].y);
  }
  ctx.stroke();

  // Red area (unreachable portion — mirror line)
  const redPts=data.map((d,i)=>({
    x: ML+i*xStep,
    y: MT+ch-(((100-d.pct))/100)*ch,
  }));

  ctx.beginPath();
  // Start at top-left of unreachable zone
  ctx.moveTo(pts[0].x, MT);
  for(const rp of redPts){ctx.lineTo(rp.x,rp.y);}
  ctx.lineTo(pts[n-1].x,MT);
  ctx.closePath();
  const rGrad=ctx.createLinearGradient(0,MT,0,MT+ch);
  rGrad.addColorStop(0,'rgba(255,85,85,0.15)');
  rGrad.addColorStop(1,'rgba(255,85,85,0.01)');
  ctx.fillStyle=rGrad;ctx.fill();

  // Red line
  ctx.beginPath();
  ctx.strokeStyle='#f55';ctx.lineWidth=1.5;
  for(let i=0;i<redPts.length;i++){
    i===0?ctx.moveTo(redPts[i].x,redPts[i].y):ctx.lineTo(redPts[i].x,redPts[i].y);
  }
  ctx.stroke();

  // Dot markers on green line
  for(const p of pts){
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle='#5f5';ctx.fill();
  }

  // Axis label
  ctx.save();ctx.translate(14,MT+ch/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#888';ctx.font='11px Courier New';ctx.textAlign='center';
  ctx.fillText('Reachability %',0,0);ctx.restore();

  // Legend
  const legendEl=document.getElementById('chart-legend');
  if(legendEl){
    const avgPct=data.reduce((s,d)=>s+d.pct,0)/n;
    legendEl.innerHTML=
      `<span style="color:#5f5">■ Reachable line (avg ${Math.round(avgPct)}%)</span>
       <span style="color:#f55">■ Unreachable line</span>
       <span>${n} data points · hourly buckets</span>`;
  }
}

// ---------------------------------------------------------------------------
// Tooltip — hover over chart to see details
// ---------------------------------------------------------------------------
(function(){
  const canvas=document.getElementById('reach-chart');
  if(!canvas)return;

  canvas.addEventListener('mousemove',function(e){
    const rect=canvas.getBoundingClientRect();
    const W=canvas.width, H=canvas.height;
    // Scale mouse coords to canvas coordinate space
    const scaleX=W/rect.width, scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX;
    const my=(e.clientY-rect.top)*scaleY;

    const ML=60, MR=20, MT=30, MB=50;
    const cw=W-ML-MR;
    const data=REACHABILITY_SERIES;
    if(!data||data.length<2)return;

    const n=data.length;
    const xStep=cw/(n-1);

    // Find nearest point
    let idx=Math.round((mx-ML)/xStep);
    if(idx<0)idx=0;if(idx>=n)idx=n-1;
    const d=data[idx];

    if(d){
      canvas.title=`${d.ts_utc}\nReachable: ${d.reachable}/${d.total_probes} (${d.pct}%)`;
    }
  });
})();

// ---------------------------------------------------------------------------
// Column-level Excel-style filters
// ---------------------------------------------------------------------------
function closeAllFilterMenus(){
  document.querySelectorAll('.col-filter-menu').forEach(m=>m.remove());
  openFilterMenu=null;
}

// Display name for values in filter menus
function colDisplayVal(key, val){
  if(key==='_status') return val;
  if(val && val!=='en') return val.toUpperCase();
  return val||'(none)';
}

// Build and show the dropdown menu for a given column key
function openColumnFilterMenu(colKey, btnEl){
  closeAllFilterMenus();
  const colDef = COLS.find(c=>c.key===colKey);
  if(!colDef) return;

  // Collect unique values from current dataset (all entries, not just filtered)
  const valCounts = {};
  for(const r of ENTRIES){
    let v;
    if(colKey==='_status') v = String(r._status);
    else v = String(r[colKey] ?? '');
    valCounts[v] = (valCounts[v]||0)+1;
  }
  const sortedVals = Object.keys(valCounts).sort((a,b)=>{
    // Put (none) at end
    if(!a&&b) return 1; if(a&&!b) return -1;
    return a.localeCompare(b);
  });

  // Default: all checked
  const currentSet = colFilters[colKey];
  const totalVals = sortedVals.length;
  let activeVals = new Set(sortedVals);
  if(currentSet && currentSet.size < totalVals){
    activeVals = new Set(currentSet);
  }

  // Build menu DOM
  const menu = document.createElement('div');
  menu.className = 'col-filter-menu open';

  // "Select All" checkbox
  let html = `<label style="font-weight:bold;border-bottom:1px solid #333;padding-bottom:4px;margin-bottom:2px">`;
  html += `<input type="checkbox" class="cfm-select-all" ${activeVals.size===totalVals?'checked':''}> Select All</label>`;

  for(const v of sortedVals){
    const label = colDisplayVal(colKey, v);
    const isChecked = activeVals.has(v)?'checked':'';
    const count = valCounts[v];
    html += `<label><input type="checkbox" class="cfm-val" data-val="${v}" ${isChecked}>${esc(label)}<span class="cfm-count">${count}</span></label>`;
  }

  html += `<div class="cfm-actions">`;
  html += `<button class="cfm-apply">Apply (${activeVals.size})</button>`;
  html += `<button class="cfm-clear">Clear Filter</button>`;
  html += `</div>`;
  menu.innerHTML = html;

  // Position: right below the button, anchored to TH
  const th = btnEl.closest('th');
  if(!th) return;
  const rect = th.getBoundingClientRect();
  menu.style.top = (rect.bottom - th.parentElement.getBoundingClientRect().top + 2)+'px';
  th.appendChild(menu);

  // "Select All" logic
  const saCb = menu.querySelector('.cfm-select-all');
  const valCbs = menu.querySelectorAll('.cfm-val');
  function syncAll(){
    const allChecked = [...valCbs].every(cb=>cb.checked);
    saCb.checked = allChecked;
    // Update apply button count
    const applyBtn = menu.querySelector('.cfm-apply');
    if(applyBtn) applyBtn.textContent = `Apply (${[...valCbs].filter(cb=>cb.checked).length})`;
  }
  saCb.addEventListener('click', e => {
    const state = !saCb.checked; // will flip on event
    valCbs.forEach(cb => cb.checked = saCb.checked);
    syncAll();
  });
  valCbs.forEach(cb => cb.addEventListener('change', syncAll));

  // Apply button
  menu.querySelector('.cfm-apply').addEventListener('click', () => {
    const chosen = [...valCbs].filter(cb=>cb.checked).map(cb=>cb.dataset.val);
    if(chosen.length === totalVals){
      delete colFilters[colKey];
    } else {
      colFilters[colKey] = new Set(chosen);
    }
    closeAllFilterMenus();
    page = 1; render();
  });

  // Clear filter button
  menu.querySelector('.cfm-clear').addEventListener('click', () => {
    delete colFilters[colKey];
    closeAllFilterMenus();
    page = 1; render();
  });

  openFilterMenu = menu;
}

// Click handler for th elements — delegate to filter buttons or sort
document.getElementById('head').addEventListener('click', e => {
  // Check if a filter button was clicked
  const fbtn = e.target.closest('.col-filter-btn');
  if(fbtn){
    e.stopPropagation();
    const colKey = fbtn.dataset.col;
    fbtn.classList.toggle('open');
    openColumnFilterMenu(colKey, fbtn);
    return;
  }
  // Regular sort click (skip badges)
  if(e.target.closest('.col-filter-badge')) return;
  const th=e.target.closest&&e.target.closest('th');if(!th)return;
  const key=th.dataset.key;if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=true;}
  page=1;render();closeAllFilterMenus();
});

// Close menus when clicking outside
document.addEventListener('click', e => {
  if(!e.target.closest('.col-filter-menu') && !e.target.closest('.col-filter-btn')){
    closeAllFilterMenus();
  }
});
